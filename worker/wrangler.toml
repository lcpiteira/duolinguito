name = "englishprep-ai"
main = "src/index.js"
compatibility_date = "2025-01-01"

[vars]
FIREBASE_PROJECT_ID = "englishprep-lcp"
GEMINI_MODEL = "gemini-2.5-flash"
FALLBACK_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
DAILY_LIMIT = "40"
TRANSLATE_LIMIT = "200"
TRANSLATE_MODEL = "gemini-2.5-flash-lite"
TRANSLATE_FALLBACK = "@cf/meta/m2m100-1.2b"
ALLOWED_ORIGINS = "https://lcpiteira.github.io,http://localhost:8000"

# Reserva grátis (Workers AI) quando a quota do Gemini acaba
[ai]
binding = "AI"

[[kv_namespaces]]
binding = "USAGE"
id = "f6b8b564427b452fa6a93015f6dfe70f"

# Segredo (não vai para o git): npx wrangler secret put GEMINI_API_KEY
